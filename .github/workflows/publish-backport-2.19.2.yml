name: Publish @cyberskill/shared@2.19.2 backport
on:
  workflow_dispatch:
concurrency:
  group: publish-backport-2.19.2
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    name: Publish 2.19.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          registry-url: https://registry.npmjs.org/

      - name: Publish backport tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -f .backport/cyberskill-shared-2.19.2.tgz
          npm view @cyberskill/shared@2.19.2 version >/dev/null 2>&1 && {
            echo "2.19.2 already published — skipping"
            exit 0
          } || true
          npm publish .backport/cyberskill-shared-2.19.2.tgz --access public
          npm view @cyberskill/shared@2.19.2 version
